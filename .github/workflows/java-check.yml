name: Lattice Java compile check

on:
  push:
    branches: [ "ci/java-check" ]

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.10.2.4988404"
      - name: Compile Java sources
        env:
          TELEGRAM_API_ID: "100000"
          TELEGRAM_API_HASH: "00000000000000000000000000000000"
        run: ./gradlew :TMessagesProj_App:compileAfatDebugJavaWithJavac --stacktrace --no-daemon
