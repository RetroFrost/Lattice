name: Fix Lattice API hash build config

on:
  push:
    branches: [ lattice-telegram-base ]
    paths:
      - ".github/workflows/fix-api-hash.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lattice-telegram-base
          token: ${{ github.token }}
      - name: Fix Groovy credential validation and bootstrap source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('TMessagesProj/build.gradle')
          text = p.read_text()
          old = "def latticeApiHash = (project.findProperty('TELEGRAM_API_HASH') ?: System.getenv('TELEGRAM_API_HASH') ?: '').toString()\ndef escapedLatticeApiHash = latticeApiHash.replace('\\\\', '\\\\\\\\').replace('\"', '\\\"')"
          new = "def rawLatticeApiHash = (project.findProperty('TELEGRAM_API_HASH') ?: System.getenv('TELEGRAM_API_HASH') ?: '').toString()\ndef latticeApiHash = rawLatticeApiHash.matches('[0-9a-fA-F]{32}') ? rawLatticeApiHash : ''"
          if old not in text:
              raise SystemExit('Expected broken API hash block was not found')
          text = text.replace(old, new, 1)
          text = text.replace('${escapedLatticeApiHash}', '${latticeApiHash}', 1)
          p.write_text(text)

          p = Path('scripts/bootstrap_lattice.py')
          text = p.read_text()
          old = "def latticeApiHash = (project.findProperty('TELEGRAM_API_HASH') ?: System.getenv('TELEGRAM_API_HASH') ?: '').toString()\ndef escapedLatticeApiHash = latticeApiHash.replace('\\\\', '\\\\\\\\').replace('\"', '\\\\"')"
          new = "def rawLatticeApiHash = (project.findProperty('TELEGRAM_API_HASH') ?: System.getenv('TELEGRAM_API_HASH') ?: '').toString()\ndef latticeApiHash = rawLatticeApiHash.matches('[0-9a-fA-F]{32}') ? rawLatticeApiHash : ''"
          if old not in text:
              raise SystemExit('Expected bootstrap API hash block was not found')
          text = text.replace(old, new, 1)
          text = text.replace('${escapedLatticeApiHash}', '${latticeApiHash}', 1)
          p.write_text(text)
          PY
      - name: Commit fix
        run: |
          git config user.name "RetroFrost"
          git config user.email "actions@users.noreply.github.com"
          git add TMessagesProj/build.gradle scripts/bootstrap_lattice.py
          git commit -m "Validate Lattice Telegram API hash without Groovy escaping"
          git push origin HEAD:lattice-telegram-base
