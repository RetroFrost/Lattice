name: Repair initial Lattice server

on:
  push:
    branches: [ lattice-network ]
    paths:
      - ".github/workflows/fix-server-bootstrap.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lattice-network
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Repair source and module metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server/internal/app/app.go')
          s = p.read_text()
          old = '''\t\t\t}\n\t}\n\th.mu.RUnlock()'''
          new = '''\t\t\t}\n\t\t}\n\t}\n\th.mu.RUnlock()'''
          if old not in s:
              raise SystemExit('websocket brace pattern not found')
          s = s.replace(old, new, 1)
          old_verify = '''\tvar saltB64, hashB64 string\n\tif _, err := fmt.Sscanf(encoded, "$argon2id$v=19$m=%d,t=%d,p=%d$%s$%s", &memory, &iterations, &parallelism, &saltB64, &hashB64); err != nil {\n\t\treturn false\n\t}\n\t// fmt.Sscanf with %s does not stop at '$', so parse explicitly.\n\tparts := strings.Split(encoded, "$")'''
          new_verify = '''\tparts := strings.Split(encoded, "$")'''
          if old_verify not in s:
              raise SystemExit('password verifier pattern not found')
          s = s.replace(old_verify, new_verify, 1)
          p.write_text(s)
          PY
          cd server
          gofmt -w internal/app/app.go cmd/lattice-server/main.go
          go mod tidy
      - name: Commit repair
        run: |
          git config user.name "RetroFrost"
          git config user.email "actions@users.noreply.github.com"
          git add server/internal/app/app.go server/go.mod server/go.sum server/cmd/lattice-server/main.go
          git commit -m "Fix server compile and password verification"
          git push origin HEAD:lattice-network
