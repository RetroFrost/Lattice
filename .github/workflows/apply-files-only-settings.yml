name: Apply files-only settings integration

on:
  push:
    branches: [ lattice-telegram-base ]
    paths:
      - ".github/workflows/apply-files-only-settings.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lattice-telegram-base
          token: ${{ github.token }}
      - name: Patch Telegram settings and picker
        run: python3 scripts/add_files_only_settings.py
      - name: Commit integration
        run: |
          git config user.name "RetroFrost"
          git config user.email "actions@users.noreply.github.com"
          git add TMessagesProj/src/main/java/org/telegram/ui/DialogsActivity.java TMessagesProj/src/main/java/org/telegram/ui/PrivacySettingsActivity.java
          git commit -m "Add multi-chat files-only selector"
          git push origin HEAD:lattice-telegram-base
