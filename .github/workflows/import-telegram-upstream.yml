name: Import official Telegram Android upstream

on:
  push:
    paths:
      - ".github/workflows/import-telegram-upstream.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Import Telegram Android snapshot into telegram-upstream
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: 45ab8f4308496e1f01026a97fcdb0d58a5274474
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/DrKLO/Telegram.git telegram
          cd telegram
          test "$(git rev-parse HEAD)" = "$UPSTREAM_SHA"

          git config user.name "RetroFrost"
          git config user.email "actions@users.noreply.github.com"

          git checkout --orphan lattice-import
          git add -A
          git commit -m "Import official Telegram Android snapshot" -m "Upstream: DrKLO/Telegram@$UPSTREAM_SHA" -m "License: GNU GPL v2 or later"

          git remote remove origin
          git remote add lattice "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push lattice HEAD:refs/heads/telegram-upstream --force
