name: Import official Telegram Android upstream

on:
  push:
    paths:
      - ".github/workflows/import-telegram-upstream.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Import Telegram Android master into telegram-upstream
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: 45ab8f4308496e1f01026a97fcdb0d58a5274474
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/DrKLO/Telegram.git telegram
          cd telegram
          git checkout --detach "$UPSTREAM_SHA"
          git remote remove origin
          git remote add lattice "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push lattice HEAD:refs/heads/telegram-upstream --force
