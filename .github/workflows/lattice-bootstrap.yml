name: Bootstrap Lattice Telegram fork

on:
  push:
    branches: [ lattice-telegram-base ]
    paths:
      - ".github/workflows/lattice-bootstrap.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Lattice Telegram base
        uses: actions/checkout@v4
        with:
          ref: lattice-telegram-base
          token: ${{ github.token }}

      - name: Apply Lattice fork patches
        run: python3 scripts/bootstrap_lattice.py

      - name: Commit patched Telegram base
        run: |
          git config user.name "RetroFrost"
          git config user.email "actions@users.noreply.github.com"
          git add TMessagesProj
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
          else
            git commit -m "Turn Telegram Android snapshot into Lattice base"
            git push origin HEAD:lattice-telegram-base
          fi
