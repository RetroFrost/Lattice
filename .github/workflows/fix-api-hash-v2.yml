name: Repair Lattice API hash configuration

on:
  push:
    branches: [ lattice-telegram-base ]
    paths:
      - ".github/workflows/fix-api-hash-v2.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lattice-telegram-base
          token: ${{ github.token }}
      - name: Repair build and bootstrap sources
        run: |
          python3 - <<'PY'
          from pathlib import Path

          targets = [Path('TMessagesProj/build.gradle'), Path('scripts/bootstrap_lattice.py')]
          for path in targets:
              lines = path.read_text().splitlines()
              out = []
              seen_raw = 0
              seen_escape = 0
              for line in lines:
                  if line.startswith("def latticeApiHash = (project.findProperty('TELEGRAM_API_HASH')"):
                      out.append("def rawLatticeApiHash = (project.findProperty('TELEGRAM_API_HASH') ?: System.getenv('TELEGRAM_API_HASH') ?: '').toString()")
                      seen_raw += 1
                  elif line.startswith('def escapedLatticeApiHash ='):
                      out.append("def latticeApiHash = rawLatticeApiHash.matches('[0-9a-fA-F]{32}') ? rawLatticeApiHash : ''")
                      seen_escape += 1
                  else:
                      out.append(line.replace('${escapedLatticeApiHash}', '${latticeApiHash}'))
              if seen_raw != 1 or seen_escape != 1:
                  raise SystemExit(f'{path}: expected one credential pair, got {seen_raw}/{seen_escape}')
              path.write_text('\n'.join(out) + '\n')
          PY
      - name: Commit repair
        run: |
          git config user.name "RetroFrost"
          git config user.email "actions@users.noreply.github.com"
          git add TMessagesProj/build.gradle scripts/bootstrap_lattice.py
          git commit -m "Validate Telegram API hash as hex"
          git push origin HEAD:lattice-telegram-base
