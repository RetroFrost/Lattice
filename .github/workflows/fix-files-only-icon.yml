name: Fix files-only icon references

on:
  push:
    branches: [ lattice-telegram-base ]
    paths:
      - ".github/workflows/fix-files-only-icon.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lattice-telegram-base
          token: ${{ github.token }}
      - name: Replace nonexistent file icon with valid Telegram icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          paths = [
              Path('TMessagesProj/src/main/java/org/telegram/ui/Components/MediaActivity.java'),
              Path('TMessagesProj/src/main/java/org/telegram/ui/LatticeFilesOnlyActivity.java'),
              Path('scripts/bootstrap_lattice.py'),
          ]
          total = 0
          for path in paths:
              text = path.read_text()
              count = text.count('R.drawable.msg_file')
              total += count
              path.write_text(text.replace('R.drawable.msg_file', 'R.drawable.msg_settings'))
          if total < 2:
              raise SystemExit(f'Expected at least two msg_file references, found {total}')
          print(f'Replaced {total} icon references')
          PY
      - name: Commit icon fix
        run: |
          git config user.name "RetroFrost"
          git config user.email "actions@users.noreply.github.com"
          git add TMessagesProj/src/main/java/org/telegram/ui/Components/MediaActivity.java TMessagesProj/src/main/java/org/telegram/ui/LatticeFilesOnlyActivity.java scripts/bootstrap_lattice.py
          git commit -m "Use valid Telegram icon for files-only controls"
          git push origin HEAD:lattice-telegram-base
